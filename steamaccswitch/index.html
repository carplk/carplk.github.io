<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Account Switcher</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 40px 30px;
            width: 420px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 24px;
            color: #f0f6fc;
            margin-bottom: 15px;
            font-weight: 700;
        }
        p {
            font-size: 14px;
            color: #8b949e;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .btn {
            background-color: #1f6beb;
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s ease;
            width: 100%;
        }
        .btn:hover {
            background-color: #388bfd;
            box-shadow: 0 4px 12px rgba(31, 107, 235, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Steam Account Switcher</h1>
        <p>С помощью этой утилиты вы можете удобно переключаться между аккаунтами Steam (особенно если их у вас много).</p>
        <a href="https://github.com/carplk/carplk.github.io/raw/refs/heads/main/steamaccswitch/simpleaccswitch.exe" class="btn">Скачать</a>
    </div>

</body>
</html>
