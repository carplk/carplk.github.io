<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault Decryptor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.12) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #f8fafc;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 32px 28px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            transition: all 0.3s ease;
        }

        .card.shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
            border-color: rgba(239, 68, 68, 0.5);
        }

        .card.dragover {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.08);
            transform: scale(1.02);
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .icon-box {
            width: 56px;
            height: 56px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2px;
            transition: all 0.3s ease;
        }

        .icon-box svg {
            width: 24px;
            height: 24px;
            stroke: #38bdf8;
            transition: all 0.3s ease;
        }

        .card.unlocked .icon-box {
            background: rgba(34, 197, 94, 0.1);
            border-color: rgba(34, 197, 94, 0.3);
        }

        .card.unlocked .icon-box svg {
            stroke: #22c55e;
        }

        .instruction {
            font-size: 12px;
            color: #94a3b8;
            text-align: center;
            line-height: 1.4;
            padding: 0 4px;
            margin-bottom: 2px;
        }

        .input-group {
            width: 100%;
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-group > svg.key-icon {
            position: absolute;
            left: 16px;
            width: 18px;
            height: 18px;
            stroke: #64748b;
            transition: stroke 0.2s ease;
            pointer-events: none;
        }

        input[type="text"] {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 12px 46px 12px 46px;
            color: #f8fafc;
            font-size: 13px;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        input:focus ~ svg.key-icon {
            stroke: #38bdf8;
        }

        input::placeholder {
            color: #64748b;
        }

        .paste-btn {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: background 0.2s ease;
        }

        .paste-btn:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .paste-btn svg {
            width: 16px;
            height: 16px;
            stroke: #94a3b8;
            transition: stroke 0.2s ease;
        }

        .paste-btn:hover svg {
            stroke: #38bdf8;
        }

        .paste-btn .tooltip {
            visibility: hidden;
            opacity: 0;
            background-color: #1e293b;
            color: #f8fafc;
            text-align: center;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            white-space: nowrap;
            position: absolute;
            bottom: 125%;
            right: 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
            transition: opacity 0.2s ease, visibility 0.2s ease;
            pointer-events: none;
            z-index: 10;
        }

        .paste-btn:hover .tooltip {
            visibility: visible;
            opacity: 1;
        }

        .get-file-btn {
            width: 100%;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 14px;
            padding: 11px;
            text-align: center;
            color: #38bdf8;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .get-file-btn:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: rgba(56, 189, 248, 0.4);
            transform: translateY(-1px);
        }

        .get-file-btn svg {
            width: 16px;
            height: 16px;
            stroke: #38bdf8;
        }

        .file-label {
            width: 100%;
            background: rgba(15, 23, 42, 0.4);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            padding: 12px;
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-label:hover {
            border-color: #38bdf8;
            color: #f8fafc;
            background: rgba(56, 189, 248, 0.05);
        }

        input[type="file"] {
            display: none;
        }

        .action-btn {
            width: 52px;
            height: 52px;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            margin-top: 2px;
            box-shadow: 0 8px 16px -4px rgba(56, 189, 248, 0.3);
        }

        .action-btn:hover {
            background: #7dd3fc;
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -4px rgba(56, 189, 248, 0.4);
        }

        .action-btn:active {
            transform: translateY(0);
        }

        .action-btn svg {
            width: 22px;
            height: 22px;
            stroke: #0f172a;
        }

        .download-container {
            width: 100%;
            display: none;
            justify-content: center;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .download-btn {
            width: 52px;
            height: 52px;
            background: #22c55e;
            color: #0f172a;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 8px 16px -4px rgba(34, 197, 94, 0.4);
        }

        .download-btn:hover {
            background: #4ade80;
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -4px rgba(34, 197, 94, 0.5);
        }

        .download-btn svg {
            width: 22px;
            height: 22px;
            stroke: #0f172a;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(15, 23, 42, 0.2);
            border-top-color: #0f172a;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-msg {
            font-size: 12px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <div class="icon-box" id="iconBox">
            <svg id="lockIcon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>

        <div class="instruction">Скачайте .enc файл и вставьте его сюда, затем вставьте ключ</div>

        <!-- Кнопка скачивания .enc файла -->
        <button class="get-file-btn" onclick="downloadEncFile()">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Скачать .enc файл
        </button>

        <!-- Выбор файла / Зона Drag and Drop -->
        <label class="file-label" id="fileLabel" for="fileInput">
            Выбрать или перетащить .enc файл
        </label>
        <input type="file" id="fileInput" accept=".enc,.json" onchange="updateFileName()">

        <!-- Ввод ключа с кнопкой вставки из буфера обмена -->
        <div class="input-group">
            <input type="text" id="keyInput" placeholder="Ключ расшифровки" required autocomplete="off">
            <svg class="key-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 2l-2 2m-1.5 1.5l-3 3m-6.5 2.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"></path>
                <path d="M15.5 7.5l3 3m0 -3l-3 3"></path>
            </svg>
            <button type="button" class="paste-btn" onclick="pasteFromClipboard()">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                    <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                </svg>
                <span class="tooltip">Вставить ключ из буфера обмена</span>
            </button>
        </div>

        <div class="status-msg" id="statusMsg"></div>

        <!-- Кнопка старта -->
        <button class="action-btn" id="decryptBtn" onclick="handleDecrypt()">
            <span class="spinner" id="btnSpinner"></span>
            <svg id="btnIcon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </button>

        <!-- Кнопка скачивания готового docx -->
        <div class="download-container" id="downloadContainer">
            <a href="#" class="download-btn" id="downloadBtn" download="document.docx">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
            </a>
        </div>
    </div>

    <script>
        // Обработка Drag and Drop
        const card = document.getElementById('mainCard');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            card.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            card.addEventListener(eventName, () => card.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            card.addEventListener(eventName, () => card.classList.remove('dragover'), false);
        });

        card.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files.length > 0) {
                document.getElementById('fileInput').files = files;
                updateFileName();
            }
        }, false);

        async function downloadEncFile() {
            const fileUrl = "https://raw.githubusercontent.com/carplk/carplk.github.io/main/tf2_cheap_items/document.docx.enc";
            try {
                showStatus('Загрузка .enc файла...');
                const response = await fetch(fileUrl);
                if (!response.ok) throw new Error('Ошибка сети');
                const blob = await response.blob();
                
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'document.docx.enc';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                showStatus('Файл скачан!');
                setTimeout(() => { document.getElementById('statusMsg').style.display = 'none'; }, 2000);
            } catch (err) {
                console.error(err);
                showStatus('Не удалось скачать файл', true);
            }
        }

        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('keyInput').value = text.trim();
                showStatus('Ключ вставлен');
                setTimeout(() => { document.getElementById('statusMsg').style.display = 'none'; }, 1500);
            } catch (err) {
                console.error(err);
                showStatus('Разрешите доступ к буферу', true);
            }
        }

        function updateFileName() {
            const fileInput = document.getElementById('fileInput');
            const fileLabel = document.getElementById('fileLabel');
            if (fileInput.files.length > 0) {
                fileLabel.innerText = "📄 " + fileInput.files[0].name;
                fileLabel.style.borderColor = "#38bdf8";
                fileLabel.style.color = "#38bdf8";
            }
        }

        function base64ToUint8Array(base64) {
            const binaryString = atob(base64);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes;
        }

        function showStatus(text, isError = false) {
            const msg = document.getElementById('statusMsg');
            msg.innerText = text;
            msg.style.color = isError ? '#ef4444' : '#38bdf8';
            msg.style.display = 'block';
        }

        async function handleDecrypt() {
            const fileInput = document.getElementById('fileInput');
            const key = document.getElementById('keyInput').value.trim();
            
            const card = document.getElementById('mainCard');
            const decryptBtn = document.getElementById('decryptBtn');
            const btnSpinner = document.getElementById('btnSpinner');
            const btnIcon = document.getElementById('btnIcon');
            const downloadContainer = document.getElementById('downloadContainer');
            const downloadBtn = document.getElementById('downloadBtn');
            const iconBox = document.getElementById('iconBox');

            if (!key || fileInput.files.length === 0) {
                triggerShake();
                showStatus('Укажите ключ и выберите файл', true);
                return;
            }

            decryptBtn.disabled = true;
            btnSpinner.style.display = 'block';
            btnIcon.style.display = 'none';
            downloadContainer.style.display = 'none';

            try {
                showStatus('Чтение файла...');
                const payloadText = await fileInput.files[0].text();

                showStatus('Разбор структуры...');
                const payload = JSON.parse(payloadText);

                if (!payload || payload.format !== 'docx_vault_v2') {
                    throw new Error('Неверный формат зашифрованного файла');
                }

                showStatus('Декодирование данных...');
                await new Promise(r => setTimeout(r, 30));

                const salt = base64ToUint8Array(payload.salt);
                const iv = base64ToUint8Array(payload.iv);
                const ciphertext = base64ToUint8Array(payload.data);

                showStatus('Расшифровка ключом...');
                await new Promise(r => setTimeout(r, 30));

                const encoder = new TextEncoder();
                const keyMaterial = await crypto.subtle.importKey(
                    'raw',
                    encoder.encode(key),
                    'PBKDF2',
                    false,
                    ['deriveKey']
                );

                const derivedKey = await crypto.subtle.deriveKey(
                    {
                        name: 'PBKDF2',
                        salt: salt,
                        iterations: 10000,
                        hash: 'SHA-256'
                    },
                    keyMaterial,
                    { name: 'AES-GCM', length: 256 },
                    false,
                    ['decrypt']
                );

                const decryptedBuffer = await crypto.subtle.decrypt(
                    {
                        name: 'AES-GCM',
                        iv: iv
                    },
                    derivedKey,
                    ciphertext
                );

                showStatus('Готово!');
                const blob = new Blob([decryptedBuffer], { 
                    type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' 
                });
                const blobUrl = URL.createObjectURL(blob);

                downloadBtn.href = blobUrl;
                downloadBtn.download = 'document.docx';

                card.classList.add('unlocked');
                iconBox.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
                    </svg>
                `;

                downloadContainer.style.display = 'flex';
                setTimeout(() => { document.getElementById('statusMsg').style.display = 'none'; }, 2000);

            } catch (err) {
                console.error(err);
                showStatus(err.message || 'Ошибка расшифровки', true);
                triggerShake();
            } finally {
                decryptBtn.disabled = false;
                btnSpinner.style.display = 'none';
                btnIcon.style.display = 'block';
            }
        }

        function triggerShake() {
            const card = document.getElementById('mainCard');
            card.classList.remove('shake');
            void card.offsetWidth;
            card.classList.add('shake');
        }
    </script>
</body>
</html>
