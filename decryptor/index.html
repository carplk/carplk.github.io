<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault Decryptor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.12) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #f8fafc;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 36px 28px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            transition: all 0.3s ease;
        }

        .card.shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
            border-color: rgba(239, 68, 68, 0.5);
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .icon-box {
            width: 68px;
            height: 68px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 4px;
            transition: all 0.3s ease;
        }

        .icon-box svg {
            width: 30px;
            height: 30px;
            stroke: #38bdf8;
            transition: all 0.3s ease;
        }

        .card.unlocked .icon-box {
            background: rgba(34, 197, 94, 0.1);
            border-color: rgba(34, 197, 94, 0.3);
        }

        .card.unlocked .icon-box svg {
            stroke: #22c55e;
        }

        .input-group {
            width: 100%;
            position: relative;
        }

        .input-group svg {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            stroke: #64748b;
            transition: stroke 0.2s ease;
        }

        input {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 14px 16px 14px 46px;
            color: #f8fafc;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        input:focus + svg {
            stroke: #38bdf8;
        }

        input::placeholder {
            color: #64748b;
        }

        /* Компактная нерастянутая кнопка */
        .action-btn {
            width: 56px;
            height: 56px;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            margin-top: 4px;
            box-shadow: 0 8px 16px -4px rgba(56, 189, 248, 0.3);
        }

        .action-btn:hover {
            background: #7dd3fc;
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -4px rgba(56, 189, 248, 0.4);
        }

        .action-btn:active {
            transform: translateY(0);
        }

        .action-btn svg {
            width: 22px;
            height: 22px;
            stroke: #0f172a;
        }

        .download-container {
            width: 100%;
            display: none;
            justify-content: center;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Компактная кнопка скачивания */
        .download-btn {
            width: 56px;
            height: 56px;
            background: #22c55e;
            color: #0f172a;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 8px 16px -4px rgba(34, 197, 94, 0.4);
        }

        .download-btn:hover {
            background: #4ade80;
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -4px rgba(34, 197, 94, 0.5);
        }

        .download-btn svg {
            width: 22px;
            height: 22px;
            stroke: #0f172a;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(15, 23, 42, 0.2);
            border-top-color: #0f172a;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-msg {
            color: #ef4444;
            font-size: 12px;
            text-align: center;
            display: none;
            margin-top: -4px;
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <div class="icon-box" id="iconBox">
            <svg id="lockIcon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>

        <div class="input-group">
            <input type="url" id="urlInput" placeholder="URL (.enc)" required autocomplete="off">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
        </div>

        <div class="input-group">
            <input type="text" id="keyInput" placeholder="Key" required autocomplete="off">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 2l-2 2m-1.5 1.5l-3 3m-6.5 2.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"></path>
                <path d="M15.5 7.5l3 3m0 -3l-3 3"></path>
            </svg>
        </div>

        <div class="error-msg" id="errorMsg"></div>

        <button class="action-btn" id="decryptBtn" onclick="handleDecrypt()">
            <span class="spinner" id="btnSpinner"></span>
            <svg id="btnIcon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </button>

        <div class="download-container" id="downloadContainer">
            <a href="#" class="download-btn" id="downloadBtn" download="document.docx">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
            </a>
        </div>
    </div>

    <script>
    // Быстрая конвертация Base64 без блокировки потока на больших файлах
    function base64ToUint8Array(base64) {
        const binaryString = atob(base64);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) {
            bytes[i] = binaryString.charCodeAt(0);
        }
        return bytes;
    }

    function normalizeUrl(url) {
        if (url.includes('github.com') && url.includes('/blob/')) {
            return url.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/');
        }
        return url;
    }

    function setStatus(text) {
        const errorMsg = document.getElementById('errorMsg');
        errorMsg.innerText = text;
        errorMsg.style.color = '#38bdf8';
        errorMsg.style.display = 'block';
    }

    async function handleDecrypt() {
        let url = document.getElementById('urlInput').value.trim();
        const key = document.getElementById('keyInput').value.trim();
        const card = document.getElementById('mainCard');
        const decryptBtn = document.getElementById('decryptBtn');
        const btnSpinner = document.getElementById('btnSpinner');
        const btnIcon = document.getElementById('btnIcon');
        const downloadContainer = document.getElementById('downloadContainer');
        const downloadBtn = document.getElementById('downloadBtn');
        const iconBox = document.getElementById('iconBox');
        const errorMsg = document.getElementById('errorMsg');

        errorMsg.style.display = 'none';

        if (!url || !key) {
            triggerShake();
            return;
        }

        url = normalizeUrl(url);

        decryptBtn.disabled = true;
        btnSpinner.style.display = 'block';
        btnIcon.style.display = 'none';
        downloadContainer.style.display = 'none';

        try {
            setStatus('Загрузка файла...');
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error('Не удалось скачать файл (HTTP ' + response.status + ')');
            }
            
            setStatus('Чтение JSON...');
            const payload = await response.json();

            if (!payload || payload.format !== 'docx_vault_v2') {
                throw new Error('Неверный формат зашифрованного файла');
            }

            setStatus('Декодирование Base64...');
            // Даем браузеру перевести дыхание перед тяжелой операцией
            await new Promise(r => setTimeout(r, 50));

            const salt = base64ToUint8Array(payload.salt);
            const iv = base64ToUint8Array(payload.iv);
            const ciphertext = base64ToUint8Array(payload.data);

            setStatus('Расшифровка AES-GCM...');
            await new Promise(r => setTimeout(r, 50));

            const encoder = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey(
                'raw',
                encoder.encode(key),
                'PBKDF2',
                false,
                ['deriveKey']
            );

            const derivedKey = await crypto.subtle.deriveKey(
                {
                    name: 'PBKDF2',
                    salt: salt,
                    iterations: 10000,
                    hash: 'SHA-256'
                },
                keyMaterial,
                { name: 'AES-GCM', length: 256 },
                false,
                ['decrypt']
            );

            const decryptedBuffer = await crypto.subtle.decrypt(
                {
                    name: 'AES-GCM',
                    iv: iv
                },
                derivedKey,
                ciphertext
            );

            setStatus('Готово!');
            const blob = new Blob([decryptedBuffer], { 
                type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' 
            });
            const blobUrl = URL.createObjectURL(blob);

            downloadBtn.href = blobUrl;
            downloadBtn.download = 'document.docx';

            card.classList.add('unlocked');
            iconBox.innerHTML = `
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
                </svg>
            `;

            downloadContainer.style.display = 'flex';
            setTimeout(() => { errorMsg.style.display = 'none'; }, 2000);

        } catch (err) {
            console.error(err);
            errorMsg.style.color = '#ef4444';
            errorMsg.innerText = err.message || 'Ошибка расшифровки';
            errorMsg.style.display = 'block';
            triggerShake();
        } finally {
            decryptBtn.disabled = false;
            btnSpinner.style.display = 'none';
            btnIcon.style.display = 'block';
        }
    }

    function triggerShake() {
        const card = document.getElementById('mainCard');
        card.classList.remove('shake');
        void card.offsetWidth;
        card.classList.add('shake');
    }
</script>
</body>
</html>
