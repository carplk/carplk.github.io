<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Защищенный документ</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --error: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: var(--card-bg);
            padding: 2.5rem 2rem;
            border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 0.5rem;
            font-size: 1.5rem;
            font-weight: 600;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 1.75rem;
        }

        .input-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        input[type="password"] {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-main);
            border-radius: 0.5rem;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="password"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        button {
            width: 100%;
            padding: 0.85rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        #error {
            color: var(--error);
            font-size: 0.85rem;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Защищенный документ</h2>
    <p>Введите ключ доступа для расшифровки файла</p>
    <div class="input-group">
        <input type="password" id="keyInput" placeholder="Введите пароль..." autofocus>
    </div>
    <button onclick="decryptVault()">Открыть документ</button>
    <div id="error">Неверный ключ или поврежденные данные</div>
</div>

<script>
    // Сюда подставляются твои зашифрованные данные
    const vaultData = {
      "format": "docx_vault_v2",
      "salt": "ВСТАВЬ_СВОЙ_SALT",
      "iv": "ВСТАВЬ_СВОЙ_IV",
      "data": "ВСТАВЬ_СВОЙ_DATA"
    };

    function base64ToArrayBuffer(base64) {
        const binary_string = window.atob(base64);
        const len = binary_string.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
            bytes[i] = binary_string.charCodeAt(i);
        }
        return bytes.buffer;
    }

    async function decryptVault() {
        const password = document.getElementById('keyInput').value;
        const errorEl = document.getElementById('error');
        errorEl.style.display = 'none';

        if (!password) {
            errorEl.innerText = "Пожалуйста, введите ключ";
            errorEl.style.display = 'block';
            return;
        }

        try {
            const enc = new TextEncoder();
            const salt = base64ToArrayBuffer(vaultData.salt);
            const iv = base64ToArrayBuffer(vaultData.iv);
            const data = base64ToArrayBuffer(vaultData.data);

            const keyMaterial = await window.crypto.subtle.importKey(
                "raw",
                enc.encode(password),
                { name: "PBKDF2" },
                false,
                ["deriveKey"]
            );

            const key = await window.crypto.subtle.deriveKey(
                {
                    name: "PBKDF2",
                    salt: salt,
                    iterations: 100000,
                    hash: "SHA-256"
                },
                keyMaterial,
                { name: "AES-GCM", length: 256 },
                false,
                ["decrypt"]
            );

            const decryptedContent = await window.crypto.subtle.decrypt(
                {
                    name: "AES-GCM",
                    iv: new Uint8Array(iv)
                },
                key,
                data
            );

            const blob = new Blob([decryptedContent], { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "document.docx";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

        } catch (e) {
            console.error(e);
            errorEl.innerText = "Неверный ключ или ошибка расшифровки";
            errorEl.style.display = 'block';
        }
    }
</script>

</body>
</html>
