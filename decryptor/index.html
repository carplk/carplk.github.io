    <style>

            font-size: 1rem;
            box-sizing: border-box;
            margin-bottom: 1rem;
            outline: none;
            transition: border-color 0.2s;

        button {
            width: 100%;
            padding: 0.75rem;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

    // Функция для конвертации Base64 в ArrayBuffer
    function base64ToArrayBuffer(base64) {
        const binary_string = window.atob(base64);
        const len = binary_string.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
            bytes[i] = binary_string.charCodeAt(i);
        }
        return bytes.buffer;
    }

    async function decryptVault() {
        const password = document.getElementById('keyInput').value;
        const errorEl = document.getElementById('error');
        errorEl.style.display = 'none';

        if (!password) {
            errorEl.innerText = "Пожалуйста, введите ключ";
            errorEl.style.display = 'block';
            return;
        }

        try {
            // Подготовка ключа через PBKDF2
            const enc = new TextEncoder();
            const salt = base64ToArrayBuffer(vaultData.salt);
            const iv = base64ToArrayBuffer(vaultData.iv);
            const data = base64ToArrayBuffer(vaultData.data);

            const keyMaterial = await window.crypto.subtle.importKey(
                "raw",
                enc.encode(password),
                { name: "PBKDF2" },
                false,
                ["deriveKey"]
            );

            const key = await window.crypto.subtle.deriveKey(
                {
                    name: "PBKDF2",
                    salt: salt,
                    iterations: 100000,
                    hash: "SHA-256"
                },
                keyMaterial,
                { name: "AES-GCM", length: 256 },
                false,
                ["decrypt"]
            );

            // Расшифровка данных
            const decryptedContent = await window.crypto.subtle.decrypt(
                {
                    name: "AES-GCM",
                    iv: new Uint8Array(iv)
                },
                key,
                data
            );

            // Создаем файл и запускаем скачивание
            const blob = new Blob([decryptedContent], { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "document.docx";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

        } catch (e) {
            console.error(e);
            errorEl.innerText = "Неверный ключ или ошибка расшифровки";
            errorEl.style.display = 'block';
        }
    }
